name: "GitHub Actions - CI"

permissions: read-all

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_MIN: "3.11"
  PYTHON_STABLE: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_STABLE }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_STABLE }}

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system ruff mypy

      - name: Determine changed Python files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE="HEAD~1"
            HEAD="HEAD"
          else
            BASE="$(git rev-list --max-parents=0 HEAD)"
            HEAD="HEAD"
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BASE" "$HEAD" | grep -E '\.py$' | tr '\n' ' ' || true)
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD}" >> "$GITHUB_OUTPUT"
          echo "Files to check: ${CHANGED:-none}"

      - name: Ruff lint
        if: steps.changes.outputs.changed != ''
        run: ruff check ${{ steps.changes.outputs.changed }} --output-format=github

      - name: Ruff format
        if: steps.changes.outputs.changed != ''
        run: ruff format --check --diff ${{ steps.changes.outputs.changed }}

      - name: MyPy
        if: steps.changes.outputs.changed != ''
        run: mypy src/siyarix

      - name: Pre-commit hooks
        env:
          BASE_REF: ${{ steps.changes.outputs.base }}
          HEAD_REF: ${{ steps.changes.outputs.head }}
        run: |
          pipx run pre-commit run --from-ref "$BASE_REF" --to-ref "$HEAD_REF" || true

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system pytest pytest-asyncio pytest-cov pytest-timeout pytest-xdist click openai respx

      - name: Run tests
        shell: bash
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            -n auto \
            -v \
            --tb=short \
            -m "not e2e and not stress and not chaos"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.os }}
          path: coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false


  production-check:
    name: Production Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_STABLE }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_STABLE }}

      - name: Install package
        run: uv pip install --system -e .

      - name: Run siyarix production-check
        env:
          # CI has no vault password / providers — warn is expected; fail on hard fails.
          SIYARIX_SAFE_MODE: "1"
        run: |
          siyarix production-check
          # Exit 0 with needs-attention is OK; --strict would fail on warns (file_key).
          # Gate hard failures only: re-run and parse readiness grade.
          out="$(siyarix production-check 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -q "not-ready"; then
            echo "production-check reported not-ready"
            exit 1
          fi
          if echo "$out" | grep -E "│.*│ fail │" >/dev/null; then
            echo "production-check has failing rows"
            exit 1
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_STABLE }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_STABLE }}

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Bandit
        run: |
          uv pip install --system bandit
          set +e
          bandit -r src/ -f json -o bandit-report.json -ll
          bandit_rc=$?
          set -e
          python scripts/ci_security_gate.py bandit bandit-report.json
          if [ "$bandit_rc" -gt 1 ]; then exit "$bandit_rc"; fi

      - name: pip-audit
        run: |
          uv pip install --system pip-audit
          set +e
          pip-audit --format json --output pip-audit.json
          audit_rc=$?
          set -e
          python scripts/ci_security_gate.py pip-audit pip-audit.json
          if [ "$audit_rc" -gt 1 ]; then exit "$audit_rc"; fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-reports
          path: |
            bandit-report.sarif
            pip-audit.json

  compatibility:
    name: Package Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_STABLE }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_STABLE }}

      - name: Install build tools
        run: |
          uv pip install --system build twine check-wheel-contents

      - name: Build sdist & wheel
        run: python -m build

      - name: Check wheel
        run: check-wheel-contents --ignore W002 dist/ || true

      - name: Twine check
        run: twine check dist/*

      - name: Verify entry points
        run: |
          uv pip install --system dist/*.whl
          python -c "from siyarix import main; print('CLI entry point OK')"
          python -c "import siyarix; print('Package import OK:', siyarix.__version__)"

  full-lint:
    name: Full Repository Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_STABLE }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_STABLE }}

      - name: Install linters
        run: |
          uv pip install --system ruff mypy -e ".[dev]"

      - name: Full lint scan
        continue-on-error: true
        run: |
          echo "::group::Ruff Lint"
          ruff check src tests --output-format=github
          echo "::endgroup::"

          echo "::group::Ruff Format"
          ruff format --check src tests || true
          echo "::endgroup::"

          echo "::group::MyPy"
          mypy src/siyarix
          echo "::endgroup::"

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, test, security-audit, compatibility]
    if: failure() && github.event_name == 'push'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `CI Failure on ${context.ref.replace('refs/heads/', '')}`,
                body: `CI pipeline failed on branch \`${context.ref.replace('refs/heads/', '')}\`.

                Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
                Commit: ${context.sha}

                Please investigate and resolve the issues.`,
                labels: ['ci-failure', 'bug']
              });
            }
