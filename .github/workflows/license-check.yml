name: "GitHub Actions - License Compliance"
on:
  pull_request:
permissions: read-all

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install pip-licenses==5.0.0
          pip install -e .
      - name: Check Licenses
        run: |
          pip-licenses --format=markdown --with-system --output-file=licenses.md
          cat licenses.md
          # Example to fail if GPL is found (uncomment in prod if strict)
          # if grep -q -i "gpl" licenses.md; then echo "GPL License found"; exit 1; fi
