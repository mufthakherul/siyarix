name: "GitHub Actions - Secret Scanner"

on:
  push:
  pull_request:

permissions: read-all

jobs:
  # Required gate: verified findings only (--only-verified). Hard-fails PRs/pushes
  # so actionable secrets cannot merge green. Do not add continue-on-error here.
  trufflehog:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@f446421baf832d6356c42c1743d99abff52ff334 # main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # Advisory only: Gitleaks heuristics are known-noisy (entropy / pattern FPs).
  # Job id suffix -advisory + continue-on-error keep the workflow green while
  # still surfacing findings in the Actions log. Not a required merge gate.
  gitleaks-advisory:
    name: Gitleaks Secrets Scan (Advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
