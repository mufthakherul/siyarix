# Type-checking configuration for mypy CLI.
# Keep in sync with [tool.mypy] in pyproject.toml (canonical for poetry/uv tooling).

[mypy]
python_version = 3.11
check_untyped_defs = true
ignore_missing_imports = false
warn_unused_ignores = true
strict_optional = true

[mypy-tests.*]
ignore_errors = true

[mypy-scripts.*]
ignore_errors = true

[mypy-pyperclip]
ignore_missing_imports = true

[mypy-redis]
ignore_missing_imports = true

[mypy-google.generativeai.*]
ignore_missing_imports = true

[mypy-httpx.*]
ignore_missing_imports = true
