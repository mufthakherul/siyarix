# Type-checking configuration for mypy CLI.
# Single SoT for module overrides: [tool.mypy] in pyproject.toml (MOD-P0 dropped
# google.generativeai; do not re-add generativeai ignores here).

[mypy]
python_version = 3.11
check_untyped_defs = true
ignore_missing_imports = false
warn_unused_ignores = true
strict_optional = true

[mypy-tests.*]
ignore_errors = true

[mypy-scripts.*]
ignore_errors = true

[mypy-pyperclip]
ignore_missing_imports = true

[mypy-redis]
ignore_missing_imports = true

[mypy-httpx.*]
ignore_missing_imports = true
