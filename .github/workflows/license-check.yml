name: "GitHub Actions - License Compliance"
on:
  pull_request:
permissions: read-all

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system pip-licenses==5.0.0
          uv pip install --system -e .
      - name: Check Licenses
        run: |
          pip-licenses --format=markdown --with-system --output-file=licenses.md
          cat licenses.md
          # Example to fail if GPL is found (uncomment in prod if strict)
          # if grep -q -i "gpl" licenses.md; then echo "GPL License found"; exit 1; fi
